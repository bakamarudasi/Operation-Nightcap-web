<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CG Manager - Operation Nightcap</title>
<link rel="stylesheet" href="cg-manager/styles.css">
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>CG Manager</h1>
  <div class="header-actions">
    <button onclick="pickProjectFolder()">フォルダ設定</button>
    <span class="folder-status" id="folderStatus">未設定</span>
    <button onclick="showImportModal()">インポート</button>
    <button onclick="showExportModal()">エクスポート</button>
    <button onclick="downloadManifest()">ダウンロード</button>
    <button onclick="checkAllFiles()">ファイル確認</button>
    <button onclick="showCompareView()" style="background:var(--surface2)">キャラ比較</button>
    <button onclick="showMissingCGModal()" style="background:#2a5a4e;border-color:var(--success)">不足CG出力</button>
    <button onclick="rescanAssets()" style="background:#2a3a5e;border-color:#5588cc">🔄 アセット同期</button>
  </div>
</div>

<!-- Asset sync status bar -->
<div class="asset-sync-bar" id="assetSyncStatus" style="padding:4px 16px;font-size:0.75em;border-bottom:1px solid var(--border);min-height:20px"></div>

<!-- Character tabs -->
<div class="char-tabs" id="charTabs"></div>

<!-- Main -->
<div class="main">
  <!-- Left panel -->
  <div class="left-panel">
    <div class="left-toolbar">
      <div class="stat">未: <span class="stat-val" id="cntP">0</span></div>
      <div class="stat">レ: <span class="stat-val" id="cntR">0</span></div>
      <div class="stat">済: <span class="stat-val" id="cntD">0</span></div>
      <div class="stat" style="margin-left:auto">計: <span class="stat-val" id="cntA">0</span></div>
      <div class="view-toggle">
        <button class="active" id="viewList" onclick="setViewMode('list')" title="リスト表示">☰</button>
        <button id="viewGrid" onclick="setViewMode('grid')" title="グリッド表示">⊞</button>
      </div>
    </div>
    <div class="tabs">
      <div class="tab active" data-f="all" onclick="setFilter('all')">全て<span class="cnt" id="cntAT">0</span></div>
      <div class="tab" data-f="pending" onclick="setFilter('pending')">未作成<span class="cnt" id="cntPT">0</span></div>
      <div class="tab" data-f="review" onclick="setFilter('review')">レビュー<span class="cnt" id="cntRT">0</span></div>
      <div class="tab" data-f="done" onclick="setFilter('done')">採用済<span class="cnt" id="cntDT">0</span></div>
    </div>
    <div class="cg-list" id="cgList"></div>
  </div>

  <!-- Right panel -->
  <div class="right-panel" id="rightPanel">
    <div class="empty-state" id="emptyState">
      <div class="big">🎨</div>
      <div>左のリストからCGを選択</div>
    </div>

    <div id="detailView" style="display:none">
      <!-- Metadata -->
      <div class="panel">
        <h3>CG情報</h3>
        <div class="field-grid">
          <div class="field"><label>ファイル名</label><input id="dFile" onchange="saveMeta()"></div>
          <div class="field"><label>トリガー名</label><input id="dTrigger" onchange="saveMeta()"></div>
          <div class="field">
            <label>酔いLv</label>
            <select id="dLevel" onchange="saveMeta()">
              <option value="">-</option>
              <option value="Lv.0">Lv.0</option><option value="Lv.1">Lv.1</option>
              <option value="Lv.2">Lv.2</option><option value="Lv.3">Lv.3</option>
              <option value="Lv.4">Lv.4</option>
            </select>
          </div>
          <div class="field"><label>備考</label><input id="dNote" onchange="saveMeta()"></div>
        </div>
        <div id="fileStatus" style="font-size:0.75em;color:var(--text-dim)"></div>
        <button id="previewBtn" onclick="openGamePreview()" style="margin-top:8px;display:none">ゲーム内プレビュー</button>
      </div>

      <!-- Feedback log -->
      <div id="fbSection" style="display:none">
        <div class="panel">
          <h3>フィードバック履歴</h3>
          <div class="fb-log" id="fbLog"></div>
        </div>
      </div>

      <!-- Event Properties (CG only) -->
      <div class="panel" id="eventPropsPanel" style="display:none">
        <h3>イベント設定</h3>
        <div class="event-props">
          <div class="field">
            <label>cgColor</label>
            <input type="color" id="dCgColor" value="#e85d3a" onchange="saveEventProps()">
          </div>
          <div class="field">
            <label>triggerCard</label>
            <input id="dTriggerCard" style="width:130px;padding:4px 6px;background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:0.8em" onchange="saveEventProps()">
          </div>
          <div class="field">
            <label>requiredDrunkLevel</label>
            <select id="dDrunkLevel" onchange="saveEventProps()" style="padding:4px 6px;background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:0.8em">
              <option value="0">0</option><option value="1">1</option><option value="2">2</option>
              <option value="3">3</option><option value="4">4</option>
            </select>
          </div>
          <div class="field">
            <label>instantWin</label>
            <input type="checkbox" id="dInstantWin" onchange="saveEventProps()">
          </div>
        </div>
      </div>

      <!-- Preview & Review -->
      <div class="panel">
        <h3>プレビュー</h3>
        <div class="img-preview" id="imgPreview"><div class="ph">画像なし</div></div>
        <div class="hist-strip" id="histStrip"></div>
        <div class="review-btns" id="reviewBtns" style="display:none">
          <button class="success" onclick="adopt()">採用</button>
          <button class="danger" onclick="reject()">却下</button>
        </div>
      </div>

      <!-- Frame Manager (CG only) -->
      <div class="panel" id="framePanel" style="display:none">
        <h3 style="display:flex;justify-content:space-between;align-items:center">
          フレーム管理
          <span style="font-size:0.7em;color:var(--text-dim);font-weight:400" id="frameCount">0 フレーム</span>
        </h3>
        <div class="frame-list" id="frameList"></div>
        <div style="display:flex;gap:8px">
          <div class="frame-add-btn" onclick="addFrame()" style="flex:1">+ フレーム追加</div>
          <div class="frame-add-btn" onclick="exportAllFrameImages()" style="flex:1;background:var(--surface2)">📁 フレーム画像を一括エクスポート</div>
        </div>
      </div>

      <!-- Dialogue Editor (CG only) -->
      <div class="panel" id="dialoguePanel" style="display:none">
        <h3 style="display:flex;justify-content:space-between;align-items:center">
          セリフ編集
          <span style="font-size:0.7em;color:var(--text-dim);font-weight:400" id="dlgCount">0 行</span>
        </h3>
        <div class="dlg-list" id="dlgList"></div>
        <div class="dlg-add-btn" onclick="addDialogueLine()">+ セリフ追加</div>
      </div>

      <!-- Code Generator (CG only) -->
      <div class="panel" id="codeGenPanel" style="display:none">
        <h3>コード生成</h3>
        <div class="code-actions" style="margin-bottom:8px">
          <button onclick="generateEventCode()">このイベントのコード</button>
          <button onclick="generateAllEventsCode()">全イベントのコード</button>
          <button class="sm" onclick="copyCodeOutput()">コピー</button>
          <button onclick="confirmExportToCharactersTS()" style="background:#2a4a5e;border-color:#4a9eff;margin-left:auto" title="characters.ts の cgEvents を直接上書き">📤 characters.ts に直接反映</button>
        </div>
        <textarea class="code-output" id="codeOutput" readonly placeholder="上のボタンでコードを生成..."></textarea>
      </div>
    </div>
  </div>
</div>

<!-- Reject modal -->
<div class="modal-overlay hidden" id="rejectModal">
  <div class="modal">
    <h3>却下理由</h3>
    <div class="qr">
      <button onclick="qr('構図が違う')">構図が違う</button>
      <button onclick="qr('表情が違う')">表情が違う</button>
      <button onclick="qr('ポーズが違う')">ポーズが違う</button>
      <button onclick="qr('色味が違う')">色味が違う</button>
      <button onclick="qr('品質が低い')">品質が低い</button>
      <button onclick="qr('キャラが似てない')">キャラ似てない</button>
    </div>
    <textarea id="rejectReason" placeholder="理由を入力..."></textarea>
    <div class="ma">
      <button onclick="closeReject()">キャンセル</button>
      <button class="danger" onclick="doReject()">却下</button>
    </div>
  </div>
</div>

<!-- Import modal -->
<div class="modal-overlay hidden" id="importModal">
  <div class="modal">
    <h3>マニフェスト インポート</h3>
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <button onclick="document.getElementById('fileInput').click()">ファイルから読み込み</button>
      <input type="file" id="fileInput" accept=".txt" style="display:none" onchange="handleFileLoad(event)">
    </div>
    <textarea class="import-ta" id="importText" placeholder="マニフェストの内容を貼り付け..."></textarea>
    <div class="ma">
      <button onclick="closeModal('importModal')">キャンセル</button>
      <button class="primary" onclick="doImport()">読み込み</button>
    </div>
  </div>
</div>

<!-- Export modal -->
<div class="modal-overlay hidden" id="exportModal">
  <div class="modal">
    <h3>マニフェスト エクスポート</h3>
    <textarea class="import-ta" id="exportText" readonly style="height:250px"></textarea>
    <div class="ma">
      <button onclick="closeModal('exportModal')">閉じる</button>
      <button onclick="copyManifest()">コピー</button>
      <button class="primary" onclick="downloadManifest()">ダウンロード</button>
    </div>
  </div>
</div>

<!-- Drop zone overlay -->
<div class="drop-overlay" id="dropOverlay">
  <div class="drop-icon">🖼️</div>
  <div class="drop-text">画像をドロップして追加（複数可）</div>
</div>

<!-- Assignment modal -->
<div class="modal-overlay hidden" id="assignModal">
  <div class="modal assign-modal">
    <h3>CG画像を割り当て</h3>
    <div class="assign-preview" id="assignPreview"></div>
    <div class="assign-grid">
      <div>
        <label>キャラクター</label>
        <select id="assignChar" onchange="onAssignCharChange()"></select>
      </div>
      <div>
        <label>シーン（CGスロット）</label>
        <select id="assignScene"></select>
      </div>
    </div>
    <div class="assign-info" id="assignInfo"></div>
    <div class="ma">
      <button onclick="closeModal('assignModal'); pendingDropImage = null;">キャンセル</button>
      <button class="primary" onclick="doAssign()">割り当て</button>
    </div>
  </div>
</div>

<!-- Batch Assignment Modal -->
<div class="modal-overlay hidden" id="batchAssignModal">
  <div class="modal batch-modal">
    <h3>一括画像割り当て</h3>
    <div class="batch-controls">
      <div>
        <label>キャラクター（全体）</label>
        <select id="batchChar" onchange="onBatchCharChange()"></select>
      </div>
    </div>
    <div class="batch-count" id="batchCount"></div>
    <div class="batch-list" id="batchList"></div>
    <div class="ma">
      <button onclick="closeModal('batchAssignModal'); pendingBatchImages = [];">キャンセル</button>
      <button class="primary" onclick="doBatchAssign()">一括割り当て</button>
    </div>
  </div>
</div>

<!-- New CG Event Modal -->
<div class="modal-overlay hidden" id="newEventModal">
  <div class="modal new-event-modal">
    <h3>新規CGイベント作成</h3>
    <div class="field-grid">
      <div class="field">
        <label>トリガーカードID</label>
        <input id="newEvTriggerCard" placeholder="例: shoulder_lean">
      </div>
      <div class="field">
        <label>表示名</label>
        <input id="newEvTriggerName" placeholder="例: 耳元でささやく">
      </div>
      <div class="field">
        <label>requiredDrunkLevel</label>
        <select id="newEvDrunkLevel">
          <option value="0">0</option><option value="1">1</option><option value="2" selected>2</option>
          <option value="3">3</option><option value="4">4</option>
        </select>
      </div>
      <div class="field">
        <label>cgColor</label>
        <input type="color" id="newEvColor" value="#e85d3a">
      </div>
    </div>
    <div style="margin:8px 0">
      <label style="font-size:0.78em;color:var(--text-dim);display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="newEvInstantWin"> instantWin（即勝利）
      </label>
    </div>
    <div class="ma">
      <button onclick="closeModal('newEventModal')">キャンセル</button>
      <button class="primary" onclick="doCreateEvent()">作成</button>
    </div>
  </div>
</div>

<!-- Game Preview Overlay -->
<div id="gamePreviewOverlay" style="display:none"></div>

<!-- Compare Overlay -->
<div id="compareOverlay" style="display:none"></div>

<!-- Missing CG Export Modal -->
<div class="modal-overlay hidden" id="missingCGModal">
  <div class="modal" style="width:700px;max-width:95vw">
    <h3>不足CGリスト + セリフ出力</h3>
    <div style="display:flex;gap:6px;margin-bottom:8px;align-items:center">
      <button id="fmtJson" class="primary" onclick="setMissingFmt('json')">JSON</button>
      <button id="fmtMd" onclick="setMissingFmt('md')">Markdown</button>
      <span style="margin-left:auto;font-size:0.72em;color:var(--text-dim)" id="missingStats"></span>
    </div>
    <textarea class="import-ta" id="missingCGOutput" readonly style="height:400px;font-family:'Consolas','Monaco',monospace;font-size:0.75em;white-space:pre;tab-size:2"></textarea>
    <div class="ma">
      <button onclick="closeModal('missingCGModal')">閉じる</button>
      <button onclick="copyMissingCG()">コピー</button>
      <button class="primary" onclick="downloadMissingCG()">ダウンロード</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ============================================================
     JavaScript Modules (dependency order)
     ============================================================ -->
<script src="cg-manager/modules/state.js"></script>
<script src="cg-manager/modules/utils.js"></script>
<script src="cg-manager/modules/db.js"></script>
<script src="cg-manager/modules/embedded-data.js"></script>
<script src="cg-manager/modules/parser.js"></script>
<script src="cg-manager/modules/filesystem.js"></script>
<script src="cg-manager/modules/persistence.js"></script>
<script src="cg-manager/modules/characters.js"></script>
<script src="cg-manager/modules/ui.js"></script>
<script src="cg-manager/modules/detail.js"></script>
<script src="cg-manager/modules/review.js"></script>
<script src="cg-manager/modules/frames.js"></script>
<script src="cg-manager/modules/dialogue.js"></script>
<script src="cg-manager/modules/dragdrop.js"></script>
<script src="cg-manager/modules/export-import.js"></script>
<script src="cg-manager/modules/codegen.js"></script>
<script src="cg-manager/modules/preview.js"></script>
<script src="cg-manager/modules/compare.js"></script>
<script src="cg-manager/modules/missing.js"></script>
<script src="cg-manager/main.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CG Manager - Operation Nightcap</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --accent2: #ff6b8a;
    --text: #eee;
    --text-dim: #999;
    --border: #333;
    --success: #4ecdc4;
    --warn: #ffd93d;
    --done: #27ae60;
    --review: #f39c12;
    --missing: #c0392b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* Header */
  .header {
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header h1 {
    font-size: 1.1em;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    white-space: nowrap;
  }
  .header-actions {
    display: flex; gap: 5px; margin-left: auto;
  }
  .folder-status {
    font-size: 0.75em; color: var(--text-dim); white-space: nowrap;
    max-width: 200px; overflow: hidden; text-overflow: ellipsis;
  }
  .folder-status.active { color: var(--success); }

  /* Buttons */
  button {
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    font-size: 0.78em;
    transition: all 0.15s;
    white-space: nowrap;
  }
  button:hover { background: var(--accent); border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); }
  button.primary:hover { background: var(--accent2); }
  button.success { background: #2a7a6e; border-color: var(--success); }
  button.success:hover { background: var(--success); color: #000; }
  button.danger { border-color: #c0392b; }
  button.danger:hover { background: #c0392b; }
  button.sm { padding: 3px 7px; font-size: 0.72em; }

  /* Character tabs */
  .char-tabs {
    display: flex; align-items: center; gap: 4px;
    padding: 6px 12px; background: var(--bg);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .char-tabs label { font-size: 0.75em; color: var(--text-dim); margin-right: 4px; }
  .char-tab {
    padding: 4px 12px; border-radius: 4px;
    font-size: 0.78em; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-dim); transition: all 0.15s;
  }
  .char-tab:hover { border-color: var(--accent); color: var(--text); }
  .char-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .char-tab-add {
    padding: 4px 10px; border-radius: 4px; font-size: 0.78em; cursor: pointer;
    background: transparent; border: 1px dashed var(--border); color: var(--text-dim);
  }
  .char-tab-add:hover { border-color: var(--accent); color: var(--accent); }

  /* Main layout */
  .main {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: calc(100vh - 80px);
  }

  /* Left panel */
  .left-panel {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .left-toolbar {
    padding: 6px 8px; background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex; gap: 5px; align-items: center; flex-wrap: wrap;
  }
  .stat { font-size: 0.72em; display: flex; gap: 3px; align-items: center; }
  .stat-val { font-weight: 700; color: var(--accent2); }

  /* Tabs */
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab {
    flex: 1; padding: 7px 4px; text-align: center;
    font-size: 0.7em; cursor: pointer;
    border-bottom: 2px solid transparent;
    color: var(--text-dim); transition: all 0.2s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent2); border-bottom-color: var(--accent); }
  .tab .cnt { background: var(--surface2); padding: 1px 5px; border-radius: 8px; margin-left: 3px; font-size: 0.9em; }

  /* CG list */
  .cg-list { flex: 1; overflow-y: auto; padding: 6px; }
  .group-hdr {
    font-size: 0.72em; color: var(--text-dim); padding: 8px 4px 3px;
    font-weight: 600; display: flex; justify-content: space-between; align-items: center;
  }
  .cg-card {
    padding: 8px 10px; margin-bottom: 4px;
    background: var(--bg); border-radius: 5px;
    cursor: pointer; border: 1px solid transparent;
    transition: all 0.15s; position: relative;
  }
  .cg-card:hover { border-color: var(--accent); }
  .cg-card.selected { border-color: var(--accent); background: rgba(233,69,96,0.1); }
  .cg-card .cg-top {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.85em; font-weight: 600; margin-bottom: 2px;
  }
  .cg-card .cg-bot { font-size: 0.7em; color: var(--text-dim); display: flex; gap: 6px; align-items: center; }
  .cg-card .del-btn {
    position: absolute; top: 4px; right: 4px;
    opacity: 0; font-size: 0.7em; padding: 2px 5px;
    transition: opacity 0.15s;
  }
  .cg-card:hover .del-btn { opacity: 0.6; }
  .cg-card .del-btn:hover { opacity: 1; }

  /* Badges & dots */
  .file-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .file-dot.exists { background: var(--done); }
  .file-dot.missing { background: var(--missing); }
  .file-dot.unknown { background: var(--border); }
  .badge { font-size: 0.6em; padding: 2px 6px; border-radius: 3px; font-weight: 600; }
  .badge.pending { background: var(--surface2); color: var(--text-dim); }
  .badge.review { background: rgba(243,156,18,0.2); color: var(--review); }
  .badge.done { background: rgba(39,174,96,0.2); color: var(--done); }
  .badge.reverse { background: rgba(186,85,211,0.2); color: #c77dff; font-size: 0.55em; }
  .cg-card.reverse-card { border-left: 3px solid #c77dff; }
  .cg-card.reverse-card.selected { background: rgba(186,85,211,0.1); border-color: #c77dff; }

  /* Right panel */
  .right-panel { overflow-y: auto; padding: 16px; }
  .empty-state {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: var(--text-dim); flex-direction: column; gap: 10px;
  }
  .empty-state .big { font-size: 2.5em; opacity: 0.3; }

  /* Panels */
  .panel { background: var(--surface); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
  .panel h3 { font-size: 0.9em; margin-bottom: 10px; color: var(--accent2); }

  /* Fields */
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 0.7em; color: var(--text-dim); }
  .field input, .field select {
    padding: 5px 8px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 4px;
    color: var(--text); font-size: 0.85em;
  }

  /* Image preview */
  .img-preview {
    width: 100%; max-height: 450px; background: #0d0d1a;
    border-radius: 8px; display: flex; align-items: center;
    justify-content: center; overflow: hidden; margin-bottom: 10px;
    position: relative;
  }
  .img-preview img { max-width: 100%; max-height: 450px; object-fit: contain; border-radius: 8px; }
  .img-preview .ph { color: var(--text-dim); font-size: 0.85em; padding: 30px; text-align: center; }

  /* Thumbnails */
  .hist-strip { display: flex; gap: 6px; padding: 8px 0; overflow-x: auto; }
  .hist-thumb {
    width: 70px; height: 70px; border-radius: 5px; overflow: hidden;
    cursor: pointer; border: 2px solid transparent; flex-shrink: 0;
  }
  .hist-thumb:hover { border-color: var(--accent); }
  .hist-thumb.sel { border-color: var(--accent2); }
  .hist-thumb.adopted { border-color: var(--done); }
  .hist-thumb img { width: 100%; height: 100%; object-fit: cover; }

  .review-btns { display: flex; gap: 8px; justify-content: center; }
  .review-btns button { padding: 8px 18px; font-size: 0.85em; }

  /* Feedback log */
  .fb-log { background: var(--bg); border-radius: 5px; padding: 8px; margin-top: 8px; max-height: 120px; overflow-y: auto; }
  .fb-entry { font-size: 0.7em; padding: 4px 6px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; gap: 6px; }
  .fb-entry:last-child { border-bottom: none; }
  .fb-time { color: var(--text-dim); flex-shrink: 0; }
  .fb-reason { color: var(--warn); }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); display: flex;
    align-items: center; justify-content: center; z-index: 200;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; width: 480px; max-width: 90vw;
  }
  .modal h3 { font-size: 1em; margin-bottom: 10px; color: var(--accent2); }
  .modal textarea {
    width: 100%; padding: 8px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 5px;
    color: var(--text); font-size: 0.82em; resize: vertical;
    min-height: 70px; margin-bottom: 6px;
  }
  .modal .qr { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
  .modal .qr button { font-size: 0.7em; padding: 3px 8px; background: var(--bg); }
  .modal .ma { display: flex; gap: 6px; justify-content: flex-end; }
  .modal .import-ta {
    width: 100%; height: 180px; padding: 10px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 5px;
    color: var(--text); font-family: monospace; font-size: 0.8em;
    resize: vertical; margin-bottom: 8px;
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 20px; right: 20px;
    padding: 10px 18px; border-radius: 7px; font-size: 0.82em;
    opacity: 0; transform: translateY(10px);
    transition: all 0.3s; z-index: 100; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.ok { background: var(--success); color: #000; }
  .toast.err { background: #c0392b; color: #fff; }
  .toast.info { background: #3498db; color: #fff; }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Drop zone overlay */
  .drop-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(233,69,96,0.15);
    border: 4px dashed var(--accent);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
    backdrop-filter: blur(4px);
  }
  .drop-overlay.active { display: flex; }
  .drop-overlay .drop-icon { font-size: 4em; opacity: 0.6; }
  .drop-overlay .drop-text { font-size: 1.2em; color: var(--accent2); font-weight: 600; }

  /* Assignment modal */
  .assign-modal .assign-preview {
    width: 100%; max-height: 200px; background: #0d0d1a;
    border-radius: 8px; display: flex; align-items: center;
    justify-content: center; overflow: hidden; margin-bottom: 12px;
  }
  .assign-modal .assign-preview img { max-width: 100%; max-height: 200px; object-fit: contain; }
  .assign-modal .assign-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .assign-modal .assign-grid label { font-size: 0.75em; color: var(--text-dim); margin-bottom: 3px; display: block; }
  .assign-modal .assign-grid select {
    width: 100%; padding: 6px 8px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 5px;
    color: var(--text); font-size: 0.85em;
  }
  .assign-modal .assign-info {
    font-size: 0.78em; color: var(--text-dim); padding: 8px;
    background: var(--bg); border-radius: 5px; margin-bottom: 10px;
  }
  .assign-modal .assign-info .auto-name {
    color: var(--success); font-weight: 600; font-family: monospace;
  }

  /* ============================================
     Frame Manager
     ============================================ */
  .frame-list { display: flex; flex-direction: column; gap: 6px; }
  .frame-card {
    background: var(--bg); border-radius: 6px; padding: 8px 10px;
    border: 1px solid var(--border); display: flex; gap: 8px; align-items: center;
    transition: all 0.15s; position: relative;
  }
  .frame-card:hover { border-color: var(--accent); }
  .frame-card.active-frame { border-color: var(--accent); background: rgba(233,69,96,0.08); }
  .frame-thumb {
    width: 60px; height: 60px; border-radius: 4px; overflow: hidden;
    background: var(--surface2); display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 1.5em; color: var(--text-dim); cursor: pointer;
  }
  .frame-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .frame-thumb:hover { opacity: 0.8; }
  .frame-fields { flex: 1; display: grid; grid-template-columns: 1fr 80px 100px; gap: 6px; align-items: center; }
  .frame-fields input, .frame-fields select {
    padding: 4px 6px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 3px; color: var(--text); font-size: 0.78em; width: 100%;
  }
  .frame-fields label { font-size: 0.65em; color: var(--text-dim); display: block; margin-bottom: 1px; }
  .frame-order-btns { display: flex; flex-direction: column; gap: 2px; }
  .frame-order-btns button { padding: 2px 5px; font-size: 0.65em; }
  .frame-del { position: absolute; top: 3px; right: 3px; opacity: 0; font-size: 0.65em; padding: 1px 4px; }
  .frame-card:hover .frame-del { opacity: 0.6; }
  .frame-del:hover { opacity: 1 !important; }
  .frame-add-btn {
    border: 1px dashed var(--border); border-radius: 6px; padding: 8px;
    text-align: center; cursor: pointer; color: var(--text-dim); font-size: 0.8em;
    transition: all 0.15s;
  }
  .frame-add-btn:hover { border-color: var(--accent); color: var(--accent); }
  .frame-num {
    font-size: 0.7em; color: var(--text-dim); font-weight: 700; width: 18px; text-align: center; flex-shrink: 0;
  }

  /* ============================================
     Dialogue Editor
     ============================================ */
  .dlg-list { display: flex; flex-direction: column; gap: 4px; max-height: 400px; overflow-y: auto; }
  .dlg-line {
    display: flex; gap: 6px; align-items: center; padding: 4px 6px;
    background: var(--bg); border-radius: 4px; border: 1px solid transparent;
    transition: border-color 0.15s; position: relative;
  }
  .dlg-line:hover { border-color: var(--border); }
  .dlg-line .dlg-num { font-size: 0.65em; color: var(--text-dim); font-weight: 700; width: 16px; flex-shrink: 0; text-align: center; }
  .dlg-line input.dlg-speaker {
    width: 80px; padding: 3px 5px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 3px; color: var(--accent2); font-size: 0.78em; font-weight: 600; flex-shrink: 0;
  }
  .dlg-line input.dlg-text {
    flex: 1; padding: 3px 5px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 3px; color: var(--text); font-size: 0.78em;
  }
  .dlg-line .dlg-btns { display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s; }
  .dlg-line:hover .dlg-btns { opacity: 1; }
  .dlg-line .dlg-btns button { padding: 1px 4px; font-size: 0.65em; }
  .dlg-add-btn {
    border: 1px dashed var(--border); border-radius: 4px; padding: 6px;
    text-align: center; cursor: pointer; color: var(--text-dim); font-size: 0.78em;
    transition: all 0.15s;
  }
  .dlg-add-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ============================================
     Event Properties
     ============================================ */
  .event-props { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .event-props .field { display: flex; align-items: center; gap: 4px; }
  .event-props label { font-size: 0.72em; color: var(--text-dim); }
  .event-props input[type="color"] {
    width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 4px;
    background: transparent; cursor: pointer; padding: 0;
  }
  .event-props input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }

  /* ============================================
     Code Generator
     ============================================ */
  .code-output {
    width: 100%; min-height: 200px; max-height: 400px; padding: 10px;
    background: #0d0d1a; border: 1px solid var(--border); border-radius: 5px;
    color: #a6e3a1; font-family: 'Consolas', 'Monaco', monospace; font-size: 0.75em;
    resize: vertical; white-space: pre; overflow: auto; tab-size: 2;
  }
  .code-actions { display: flex; gap: 6px; margin-top: 8px; }

  /* ============================================
     New Event Modal
     ============================================ */
  .new-event-modal .field-grid { grid-template-columns: 1fr 1fr; }

  @media (max-width: 800px) {
    .main { grid-template-columns: 1fr; }
    .left-panel { max-height: 40vh; }
  }

  /* ============================================
     Game Preview Overlay
     ============================================ */
  .game-preview-overlay {
    position: fixed; inset: 0; z-index: 500;
    display: flex; flex-direction: column;
    background: #000; cursor: pointer;
    animation: fadeIn 0.5s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .gp-image {
    flex: 1; display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  .gp-image img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .gp-placeholder {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    width: 100%; height: 100%; justify-content: center;
  }
  .gp-textbox {
    background: linear-gradient(180deg, rgba(26,14,7,0.95), rgba(17,10,5,0.98));
    border-top: 2px solid #c8a44e;
    padding: 20px 32px 16px; min-height: 120px;
    display: flex; flex-direction: column; gap: 8px; position: relative;
  }
  .gp-textbox::before {
    content: ''; position: absolute; top: -20px; left: 0; right: 0; height: 20px;
    background: linear-gradient(180deg, transparent, rgba(17,10,5,0.6));
    pointer-events: none;
  }
  .gp-speaker { font-size: 16px; font-weight: 700; color: #ffd700; }
  .gp-text { font-size: 15px; color: #f5e6d3; line-height: 1.8; min-height: 28px; }
  .gp-next { font-size: 12px; color: #999; text-align: right; animation: gpPulse 1.5s ease-in-out infinite; }
  @keyframes gpPulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
  .gp-close {
    position: absolute; top: 12px; right: 12px; z-index: 10;
    background: rgba(0,0,0,0.6); border: 1px solid #666; border-radius: 50%;
    width: 36px; height: 36px; color: #fff; font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .gp-close:hover { background: rgba(233,69,96,0.8); }
  .gp-frame-dots {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 10;
  }
  .gp-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.3); transition: all 0.3s;
  }
  .gp-dot.active { background: #ffd700; transform: scale(1.3); }
  .gp-dot.passed { background: rgba(255,255,255,0.6); }
  .gp-progress {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 4px;
    font-size: 0.75em; color: #ccc;
  }
  .gp-seq-frame {
    width: 100%; height: 100%; display: flex;
    align-items: center; justify-content: center; position: relative;
    transition: opacity 0.3s, transform 0.3s;
  }
  .gp-seq-enter-fade { animation: seqFadeIn 0.3s ease-out forwards; }
  .gp-seq-enter-zoom { animation: seqZoomIn 0.3s ease-out forwards; }
  .gp-seq-enter-slide-left { animation: seqSlideInLeft 0.3s ease-out forwards; }
  .gp-seq-exit-fade { animation: seqFadeOut 0.3s ease-in forwards; }
  .gp-seq-exit-zoom { animation: seqZoomOut 0.3s ease-in forwards; }
  .gp-seq-exit-slide-left { animation: seqSlideOutLeft 0.3s ease-in forwards; }

  /* ============================================
     Thumbnail Grid View
     ============================================ */
  .cg-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 6px; padding: 6px;
  }
  .cg-grid .group-hdr {
    grid-column: 1 / -1;
    font-size: 0.72em; color: var(--text-dim); padding: 8px 4px 3px;
    font-weight: 600; display: flex; justify-content: space-between; align-items: center;
  }
  .cg-grid-card {
    background: var(--bg); border-radius: 6px; overflow: hidden;
    cursor: pointer; border: 2px solid transparent;
    transition: all 0.15s; position: relative;
  }
  .cg-grid-card:hover { border-color: var(--accent); }
  .cg-grid-card.selected { border-color: var(--accent); box-shadow: 0 0 8px rgba(233,69,96,0.3); }
  .cg-grid-card.reverse-card { border-left: 3px solid #c77dff; }
  .cg-grid-thumb {
    width: 100%; aspect-ratio: 1; background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; font-size: 2em; color: var(--text-dim);
  }
  .cg-grid-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .cg-grid-info {
    padding: 4px 6px; font-size: 0.65em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

<script>
// ============================================================
// State
// ============================================================
const STORAGE_PREFIX = 'nightcap_cg_pipeline_';
const CHARLIST_KEY = 'nightcap_cg_charlist';
const LASTCHAR_KEY = 'nightcap_cg_mgr_lastchar';

let currentCharId = 'blaze';
let items = [];
let selectedId = null;
let filter = 'all';
let fileExistence = {};

// ============================================================
// ゲームコード (characters.ts + cards.ts) からCG要件を動的取得
// ============================================================
let charDataCache = null;   // { charId → { name, nameEn, cgEvents[], costumeStates[] } }
let cardNameCache = {};     // cardId → 日本語名

// File System Access API でプロジェクト内のファイルを読む
async function readFileViaHandle(relativePath) {
  if (!projectDirHandle) return null;
  try {
    const parts = relativePath.split('/').filter(Boolean);
    let dir = projectDirHandle;
    for (let i = 0; i < parts.length - 1; i++) {
      dir = await dir.getDirectoryHandle(parts[i]);
    }
    const fileHandle = await dir.getFileHandle(parts[parts.length - 1]);
    const file = await fileHandle.getFile();
    return await file.text();
  } catch { return null; }
}

async function fetchGameData() {
  if (charDataCache) return;
  charDataCache = {};

  let charSrc = null, cardSrc = null;

  // 1. fetch で取得（HTTPサーバー経由 — file://プロトコル時はCORSエラーになるためスキップ）
  if (location.protocol !== 'file:') {
    try {
      const [charRes, cardRes] = await Promise.all([
        fetch('../src/data/characters.ts?t=' + Date.now()),
        fetch('../src/data/cards.ts?t=' + Date.now()),
      ]);
      if (charRes.ok) charSrc = await charRes.text();
      if (cardRes.ok) cardSrc = await cardRes.text();
    } catch {}
  }

  // 2. File System Access API で取得（フォルダ設定済みの場合）
  if (!charSrc && projectDirHandle) {
    charSrc = await readFileViaHandle('src/data/characters.ts');
  }
  if (!cardSrc && projectDirHandle) {
    cardSrc = await readFileViaHandle('src/data/cards.ts');
  }

  // 3. インライン埋め込みデータで取得（file://プロトコル用フォールバック）
  if (!charSrc && typeof EMBEDDED_CHARACTERS_SRC !== 'undefined') {
    charSrc = EMBEDDED_CHARACTERS_SRC;
  }
  if (!cardSrc && typeof EMBEDDED_CARDS_SRC !== 'undefined') {
    cardSrc = EMBEDDED_CARDS_SRC;
  }

  if (charSrc) parseCharacters(charSrc);
  if (cardSrc) parseCards(cardSrc);
}

function extractCGEventBlocks(cgBlock) {
  // Extract each top-level { ... } block from the cgEvents array content
  const blocks = [];
  let depth = 0, start = -1;
  for (let i = 0; i < cgBlock.length; i++) {
    if (cgBlock[i] === '{') { if (depth === 0) start = i; depth++; }
    else if (cgBlock[i] === '}') { depth--; if (depth === 0 && start >= 0) { blocks.push(cgBlock.slice(start, i + 1)); start = -1; } }
  }
  return blocks;
}

function parseCharacters(src) {
  // キャラIDごとのブロックを抽出
  const charBlockRe = /^\s{2}(\w+):\s*\{/gm;
  let match;
  const charStarts = [];
  while ((match = charBlockRe.exec(src)) !== null) {
    charStarts.push({ id: match[1], pos: match.index });
  }

  for (let ci = 0; ci < charStarts.length; ci++) {
    const charId = charStarts[ci].id;
    const start = charStarts[ci].pos;
    const end = ci + 1 < charStarts.length ? charStarts[ci + 1].pos : src.length;
    const block = src.slice(start, end);

    // name, nameEn
    const nameM = block.match(/name:\s*'([^']+)'/);
    const nameEnM = block.match(/nameEn:\s*'([^']+)'/);

    // cgEvents の triggerCard, requiredDrunkLevel, instantWin, dialogue, frames, cgColor
    const cgEvents = [];

    // cgEventsブロックを取得
    const cgBlockM = block.match(/cgEvents:\s*\[([\s\S]*?)\]\s*,\s*afterEvents/);
    if (cgBlockM) {
      const cgBlock = cgBlockM[1];
      // 各イベントブロックを balanced brace で抽出
      const parsedEvents = extractCGEventBlocks(cgBlock);
      for (const evBlock of parsedEvents) {
        const tcM = evBlock.match(/triggerCard:\s*'([^']+)'/);
        const dlM = evBlock.match(/requiredDrunkLevel:\s*(\d+)/);
        const iwM = evBlock.match(/instantWin:\s*true/);
        const ccM = evBlock.match(/cgColor:\s*'([^']*)'/);
        if (!tcM) continue;

        // Parse dialogue
        const dialogue = [];
        const dlgRe = /\{\s*speaker:\s*'([^']*)'\s*,\s*text:\s*'([^']*)'\s*\}/g;
        let dm;
        while ((dm = dlgRe.exec(evBlock)) !== null) {
          dialogue.push({ speaker: dm[1], text: dm[2] });
        }

        // Parse frames
        const frames = [];
        const framesM = evBlock.match(/frames:\s*\[([\s\S]*?)\]/);
        if (framesM) {
          const fRe = /\{([^}]*)\}/g;
          let fm;
          while ((fm = fRe.exec(framesM[1])) !== null) {
            const fb = fm[1];
            frames.push({
              label: fb.match(/label:\s*'([^']*)'/) ?.[1] || '',
              dialogueStart: parseInt(fb.match(/dialogueStart:\s*(\d+)/)?.[1] || '0'),
              transition: fb.match(/transition:\s*'([^']*)'/) ?.[1] || 'fade',
              imageUrl: null,
            });
          }
        }

        cgEvents.push({
          triggerCard: tcM[1],
          requiredDrunkLevel: parseInt(dlM?.[1] || '0'),
          instantWin: !!iwM,
          cgColor: ccM?.[1] || '#e85d3a',
          dialogue,
          frames,
        });
      }
    }

    // costumeStates のレベル数 + 詳細
    const costumeCount = (block.match(/level:\s*\d+.*?dishevelAmount/g) || []).length;
    const costumeStates = [];
    const csBlockM = block.match(/costumeStates:\s*\[([\s\S]*?)\]\s*,\s*drunkLevels/);
    if (csBlockM) {
      const csBlocks = extractCGEventBlocks(csBlockM[1]);
      for (const csb of csBlocks) {
        costumeStates.push({
          level: parseInt(csb.match(/level:\s*(\d+)/)?.[1] || '0'),
          label: csb.match(/label:\s*'([^']*)'/)?.[1] || '',
          description: csb.match(/description:\s*'([^']*)'/)?.[1] || '',
          dishevelAmount: parseFloat(csb.match(/dishevelAmount:\s*([\d.]+)/)?.[1] || '0'),
        });
      }
    }

    // afterEvents の解析
    const afterEvents = [];
    const aeBlockM = block.match(/afterEvents:\s*\[([\s\S]*?)\]\s*(?:,\s*\w|\})/);
    if (aeBlockM) {
      const aeBlocks = extractCGEventBlocks(aeBlockM[1]);
      for (const aeb of aeBlocks) {
        const aeDialogue = [];
        const dlgRe2 = /\{\s*speaker:\s*'([^']*)'\s*,\s*text:\s*'([^']*)'\s*\}/g;
        let dm2;
        while ((dm2 = dlgRe2.exec(aeb)) !== null) {
          aeDialogue.push({ speaker: dm2[1], text: dm2[2] });
        }
        afterEvents.push({
          id: aeb.match(/id:\s*'([^']*)'/)?.[1] || '',
          title: aeb.match(/title:\s*'([^']*)'/)?.[1] || '',
          requiredCGRate: parseFloat(aeb.match(/requiredCGRate:\s*([\d.]+)/)?.[1] || '0'),
          requiredWins: parseInt(aeb.match(/requiredWins:\s*(\d+)/)?.[1] || '0'),
          cgColor: aeb.match(/cgColor:\s*'([^']*)'/)?.[1] || '#e85d3a',
          dialogue: aeDialogue,
        });
      }
    }

    // theme color
    const themeColorM = block.match(/color:\s*'(#[^']+)'/);

    charDataCache[charId] = {
      name: nameM?.[1] || '',
      nameEn: nameEnM?.[1] || charId.toUpperCase(),
      cgEvents,
      costumeLevels: costumeCount,
      costumeStates,
      afterEvents,
      theme: { color: themeColorM?.[1] || '#e85d3a' },
    };
  }
}

let reverseHarassCards = [];

function parseCards(src) {
  // id: 'xxx', name: 'yyy' のペアを抽出
  const re = /id:\s*'([^']+)',\s*name:\s*'([^']+)'/g;
  let m;
  while ((m = re.exec(src)) !== null) {
    cardNameCache[m[1]] = m[2];
  }

  // 逆セクハラカード（sanityDamage を持つ harassment カード）を検出
  reverseHarassCards = [];
  const blockRe = /(\w+):\s*\{[^}]*id:\s*'([^']+)'[^}]*type:\s*'harassment'[^}]*requiredDrunkLevel:\s*(\d+)[^}]*sanityDamage:\s*(\d+)/g;
  let bm;
  while ((bm = blockRe.exec(src)) !== null) {
    reverseHarassCards.push({ id: bm[2], requiredDrunkLevel: parseInt(bm[3]) });
  }
}

function getCharInfo(charId) {
  return charDataCache?.[charId] || null;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function getDefaults() {
  const info = getCharInfo(currentCharId);
  if (!info) {
    return [
      { id: 'portrait', file: 'portrait.webp', trigger: '基本立ち絵', level: '', type: 'portrait', note: '' },
      { id: 'select-icon', file: 'select-icon.webp', trigger: 'キャラ選択画面用', level: '', type: 'icon', note: '' },
    ];
  }

  const items = [];

  // 逆セクハラカードIDのセット（高速判定用）
  const reverseIds = new Set(reverseHarassCards.map(rc => rc.id));

  // イベントCG — characters.ts の cgEvents から
  for (const ev of info.cgEvents) {
    const isReverse = reverseIds.has(ev.triggerCard);
    const trigger = cardNameCache[ev.triggerCard] || ev.triggerCard;
    const note = ev.instantWin ? 'instant_win' : isReverse ? 'reverse_harassment' : '';
    items.push({
      id: ev.triggerCard,
      file: ev.triggerCard + '.webp',
      trigger,
      level: 'Lv.' + ev.requiredDrunkLevel,
      type: 'cg',
      note,
      triggerCard: ev.triggerCard,
      cgColor: ev.cgColor || '#e85d3a',
      instantWin: ev.instantWin || false,
      dialogue: ev.dialogue || [],
      frames: ev.frames || [],
    });
  }

  // 逆セクハラCG — cards.ts の sanityDamage 持ちカードで characters.ts に未定義のもの
  const existingIds = new Set(items.map(i => i.id));
  for (const rc of reverseHarassCards) {
    if (existingIds.has(rc.id)) continue;
    const trigger = (cardNameCache[rc.id] || rc.id);
    items.push({
      id: rc.id,
      file: rc.id + '.webp',
      trigger,
      level: 'Lv.' + rc.requiredDrunkLevel,
      type: 'cg',
      note: 'reverse_harassment',
    });
  }

  // 立ち絵 — 基本 + 酔い段階
  items.push({ id: 'portrait', file: 'portrait.webp', trigger: '基本立ち絵', level: '', type: 'portrait', note: '' });
  const drunkLabels = ['素面', 'ほろ酔い', '酔い', 'べろべろ', '潰れ'];
  for (let i = 0; i < info.costumeLevels; i++) {
    items.push({
      id: `portrait-drunk-${i}`,
      file: `portrait-drunk-${i}.webp`,
      trigger: drunkLabels[i] || `酔いLv${i}`,
      level: `Lv.${i}`,
      type: 'portrait',
      note: '',
    });
  }

  // アイコン
  items.push({ id: 'select-icon', file: 'select-icon.webp', trigger: 'キャラ選択画面用', level: '', type: 'icon', note: '' });

  return items;
}

function makeItem(def) {
  return {
    ...def,
    status: 'pending',
    history: [],
    feedback: [],
    adoptedImage: null,
    // CG event data (editable in manager)
    dialogue: def.dialogue || [],
    frames: def.frames || [],
    cgColor: def.cgColor || '#e85d3a',
    instantWin: def.instantWin || false,
    triggerCard: def.triggerCard || def.id || '',
  };
}

function getCharList() {

  if (raw) { try { return JSON.parse(raw); } catch {} }
  return ['blaze'];
}
function saveCharList(list) { localStorage.setItem(CHARLIST_KEY, JSON.stringify(list)); }

function loadCharData(id) {
  const raw = localStorage.getItem(STORAGE_PREFIX + id);
  if (raw) { try { return JSON.parse(raw); } catch {} }

}

function renderCharTabs() {
  const el = document.getElementById('charTabs');
  const list = getCharList();
  let html = '<label>キャラ:</label>';
  list.forEach(id => {
    const data = loadCharData(id);
    const info = getCharInfo(id);
    const label = data?.charName || info?.name || id;
    const active = id === currentCharId ? ' active' : '';
    html += `<button class="char-tab${active}" onclick="switchChar('${esc(id)}')">${esc(label)}</button>`;
  });

async function switchChar(id) {
  saveAll();
  currentCharId = id;
  localStorage.setItem(LASTCHAR_KEY, id);
  selectedId = null;
  fileExistence = {};
  load();
  renderCharTabs();
  renderList();
  updateCounts();
  showEmpty();
  checkAllFiles();
}

async function addNewChar() {
  const id = prompt('新キャラのID (英字小文字)', '');
  if (!id || !/^[a-z][a-z0-9_]*$/.test(id)) {
    if (id !== null) toast('IDは英字小文字で入力してください', 'err');
    return;
  }
  const list = getCharList();
  if (list.includes(id)) { toast('このIDは既に存在します', 'err'); return; }
  list.push(id);
  saveCharList(list);
  saveAll();
  currentCharId = id;
  localStorage.setItem(LASTCHAR_KEY, id);
  items = getDefaults().map(makeItem);
  selectedId = null;
  fileExistence = {};
  saveAll();
  renderCharTabs();
  renderList();
  updateCounts();
  showEmpty();
  const info = getCharInfo(id);
  const msg = info
    ? `「${id}」を追加（ゲームコードから${info.cgEvents.length}件のCG検出）`
    : `「${id}」を追加しました`;
  toast(msg, 'ok');
  checkAllFiles();
}

function deleteChar() {
  const list = getCharList();
  if (list.length <= 1) { toast('最後のキャラは削除できません', 'err'); return; }
  if (!confirm(`「${currentCharId}」を削除しますか？`)) return;
  localStorage.removeItem(STORAGE_PREFIX + currentCharId);
  const newList = list.filter(id => id !== currentCharId);
  saveCharList(newList);
  switchChar(newList[0]);
  toast('削除しました', 'ok');
}

// ============================================================
// Persistence
// ============================================================
function saveAll() {
  const existing = loadCharData(currentCharId);
  const info = getCharInfo(currentCharId);
  const data = {
    charId: currentCharId,
    charName: existing?.charName || info?.name || '',
    charNameEn: existing?.charNameEn || info?.nameEn || currentCharId.toUpperCase(),
    items: items.map(it => ({
      id: it.id, file: it.file, trigger: it.trigger, level: it.level,
      type: it.type, note: it.note, status: it.status,
      history: it.history, feedback: it.feedback, adoptedImage: it.adoptedImage,
      dialogue: it.dialogue || [], frames: it.frames || [],
      cgColor: it.cgColor || '#e85d3a', instantWin: it.instantWin || false,
      triggerCard: it.triggerCard || it.id || '',
    })),
  };
  localStorage.setItem(STORAGE_PREFIX + currentCharId, JSON.stringify(data));
}

function load() {
  const data = loadCharData(currentCharId);
  if (!data || !data.items?.length) {
    items = getDefaults().map(makeItem);
    return;
  }
  items = data.items.map(s => ({ ...makeItem(s), ...s }));

  // ゲームコードに新規追加されたCGイベントを自動マージ + 既存アイテムにデータを補完
  const defaults = getDefaults();
  const existingIds = new Set(items.map(i => i.id));
  let added = false;
  for (const def of defaults) {
    if (!existingIds.has(def.id)) {
      items.push(makeItem(def));
      added = true;
    } else {
      // 既存アイテムにダイアログ・フレームが未設定なら characters.ts のデータで補完
      const item = items.find(i => i.id === def.id);
      if (item && item.type === 'cg') {
        if (!item.dialogue?.length && def.dialogue?.length) item.dialogue = def.dialogue;
        if (!item.frames?.length && def.frames?.length) item.frames = def.frames;
        if (!item.cgColor || item.cgColor === '#e85d3a') item.cgColor = def.cgColor || '#e85d3a';
        if (item.instantWin === undefined) item.instantWin = def.instantWin || false;
        if (!item.triggerCard) item.triggerCard = def.triggerCard || def.id;
      }
    }
  }
  if (added) saveAll();
}

// ============================================================
// File existence check
// ============================================================
function getAssetPath(item) {
  if (item.type === 'cg') return `../public/characters/${currentCharId}/cg/${item.file}`;
  return `../public/characters/${currentCharId}/${item.file}`;
}

function checkFileExists(item) {
  // file://プロトコル時はprojectDirHandle経由で確認（Image読み込みだとERR_FILE_NOT_FOUNDがコンソールに出るため）
  if (location.protocol === 'file:' && projectDirHandle) {
    return checkFileExistsViaHandle(item);
  }
  // file://でprojectDirHandle未設定の場合はスキップ（コンソールエラー抑制）
  if (location.protocol === 'file:') {
    fileExistence[item.id] = false;
    return Promise.resolve(false);
  }
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => { fileExistence[item.id] = true; resolve(true); };
    img.onerror = () => { fileExistence[item.id] = false; resolve(false); };
    img.src = getAssetPath(item) + '?t=' + Date.now();
  });
}

async function checkFileExistsViaHandle(item) {
  try {
    const pathParts = item.type === 'cg'
      ? ['assets', 'characters', currentCharId, 'cg', item.file]
      : ['assets', 'characters', currentCharId, item.file];
    let dir = projectDirHandle;
    for (let i = 0; i < pathParts.length - 1; i++) {
      dir = await dir.getDirectoryHandle(pathParts[i]);
    }
    await dir.getFileHandle(pathParts[pathParts.length - 1]);
    fileExistence[item.id] = true;
    return true;
  } catch {
    fileExistence[item.id] = false;
    return false;
  }
}

async function checkAllFiles() {
  await Promise.all(items.map(it => checkFileExists(it)));
  // ファイルが配置済みなのにステータスが未作成のままのアイテムを自動的に採用済にする
  let changed = false;
  for (const item of items) {
    if (fileExistence[item.id] === true && item.status === 'pending') {
      item.status = 'done';
      changed = true;
    }
  }
  if (changed) {
    saveAll();
    updateCounts();
  }
  renderList();
  if (selectedId) updateFileStatus(items.find(i => i.id === selectedId));
}

function updateFileStatus(item) {
  const el = document.getElementById('fileStatus');
  if (!item) { el.textContent = ''; return; }
  const exists = fileExistence[item.id];
  const path = getAssetPath(item);
  if (exists === true) {
    el.innerHTML = `<span style="color:var(--done)">● 配置済み:</span> ${esc(path)}`;
  } else if (exists === false) {
    el.innerHTML = `<span style="color:var(--missing)">● 未配置:</span> ${esc(path)}`;
  } else {
    el.innerHTML = `<span>● 未確認:</span> ${esc(path)}`;
  }
}

function renderList() {
  const list = document.getElementById('cgList');
  list.innerHTML = '';
  const filtered = items.filter(i => {
    if (filter === 'all') return true;
    if (filter === 'pending') return i.status === 'pending';
    if (filter === 'review') return i.status === 'review';
    if (filter === 'done') return i.status === 'done';
    return true;
  });

  if (viewMode === 'grid') { renderGrid(filtered); return; }

  const groups = { cg: [], portrait: [], icon: [] };
  for (const i of filtered) (groups[i.type] || groups.cg).push(i);

  const labels = { cg: 'イベントCG', portrait: '立ち絵', icon: 'アイコン' };
  for (const [type, arr] of Object.entries(groups)) {
    if (arr.length === 0 && filter !== 'all') continue;
    const hdr = document.createElement('div');
    hdr.className = 'group-hdr';
    const addAction = type === 'cg' ? `showNewEventModal()` : `addItem('${type}')`;
    hdr.innerHTML = `<span>${labels[type]} (${arr.length})</span><button class="sm" onclick="${addAction}">+ 追加</button>`;
    list.appendChild(hdr);

    for (const item of arr) {
      const isReverse = item.note === 'reverse_harassment';
      const card = document.createElement('div');
      card.className = 'cg-card' + (item.id === selectedId ? ' selected' : '') + (isReverse ? ' reverse-card' : '');
      card.onclick = () => selectItem(item.id);

      const badgeCls = { pending: 'pending', review: 'review', done: 'done' }[item.status] || 'pending';
      const badgeText = { pending: '未作成', review: 'レビュー', done: '採用済' }[item.status] || '未作成';
      const feDot = fileExistence[item.id] === true ? 'exists' : fileExistence[item.id] === false ? 'missing' : 'unknown';
      const reverseTag = isReverse ? ' <span class="badge reverse">&#x1F525; 逆セクハラ</span>' : '';

      card.innerHTML = `
        <div class="cg-top">
          <span>${esc(item.trigger)}${reverseTag}</span>
          <span class="badge ${badgeCls}">${badgeText}</span>
        </div>
        <div class="cg-bot">
          <span class="file-dot ${feDot}"></span>
          ${esc(item.file)} ${item.level ? '/ ' + item.level : ''}
        </div>
        <button class="sm danger del-btn" onclick="event.stopPropagation();removeItem('${esc(item.id)}')">✕</button>
      `;
      list.appendChild(card);
    }
  }
}

// ============================================================
function addItem(type) {
  const id = type + '_' + Date.now();
  const file = type === 'cg' ? 'new_cg.webp' : type === 'portrait' ? 'portrait-new.webp' : 'new-icon.webp';
  const trigger = '新規' + (type === 'cg' ? 'CG' : type === 'portrait' ? '立ち絵' : 'アイコン');
  items.push(makeItem({ id, file, trigger, level: '', type, note: '' }));
  saveAll(); renderList(); updateCounts();
  selectItem(id);
}

function removeItem(id) {
  if (!confirm('削除しますか？')) return;
  items = items.filter(i => i.id !== id);
  if (selectedId === id) { selectedId = null; showEmpty(); }
  saveAll(); renderList(); updateCounts();
}

function selectItem(id) {
  selectedId = id;
  const item = items.find(i => i.id === id);
  if (!item) return;

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('detailView').style.display = 'block';

  document.getElementById('dFile').value = item.file;
  document.getElementById('dTrigger').value = item.trigger;
  document.getElementById('dLevel').value = item.level || '';
  document.getElementById('dNote').value = item.note || '';
  updateFileStatus(item);
  renderFeedback(item);
  renderPreview(item);
  renderHistory(item);
  document.getElementById('reviewBtns').style.display =
    (item.status === 'review' || item.history.length > 0) ? 'flex' : 'none';
  // Show game preview button only for CG type items
  document.getElementById('previewBtn').style.display = item.type === 'cg' ? 'inline-block' : 'none';

  // Event properties panel
  const isCG = item.type === 'cg';
  document.getElementById('eventPropsPanel').style.display = isCG ? 'block' : 'none';
  document.getElementById('codeGenPanel').style.display = isCG ? 'block' : 'none';
  if (isCG) {
    document.getElementById('dCgColor').value = item.cgColor || '#e85d3a';
    document.getElementById('dTriggerCard').value = item.triggerCard || item.id;
    document.getElementById('dDrunkLevel').value = String(parseInt(item.level?.replace('Lv.', '') || '0'));
    document.getElementById('dInstantWin').checked = !!item.instantWin;
  }

  // Frame & dialogue panels
  renderFrames(item);
  renderDialogue(item);

  renderList();
}

function showEmpty() {
  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('detailView').style.display = 'none';
}

function saveMeta() {
  const item = items.find(i => i.id === selectedId);
  if (!item) return;
  const newFile = document.getElementById('dFile').value.trim();
  const newId = newFile.replace(/\.\w+$/, '');
  if (newId !== item.id) { item.id = newId; selectedId = newId; }

  item.trigger = document.getElementById('dTrigger').value.trim();
  item.level = document.getElementById('dLevel').value;

}

function renderPreview(item) {
  const el = document.getElementById('imgPreview');
  if (item.adoptedImage) {
    el.innerHTML = `<img src="${item.adoptedImage}" alt="${esc(item.trigger)}">`;
  } else if (item.history.length > 0) {
    el.innerHTML = `<img src="${item.history[item.history.length - 1].url}" alt="${esc(item.trigger)}">`;
  } else if (fileExistence[item.id] === true) {
    el.innerHTML = `<img src="${esc(getAssetPath(item))}" alt="${esc(item.trigger)}"><div style="position:absolute;bottom:8px;right:8px;background:var(--done);color:#000;padding:2px 8px;border-radius:4px;font-size:0.7em">ローカル</div>`;

}

function renderHistory(item) {
  const strip = document.getElementById('histStrip');
  strip.innerHTML = '';
  for (let i = 0; i < item.history.length; i++) {
    const h = item.history[i];
    const t = document.createElement('div');

    t.innerHTML = `<img src="${h.url}" alt="${i + 1}">`;
    t.onclick = () => {
      document.getElementById('imgPreview').innerHTML = `<img src="${h.url}" alt="${esc(item.trigger)}">`;
      strip.querySelectorAll('.hist-thumb').forEach(x => x.classList.remove('sel'));

function renderFeedback(item) {
  const sec = document.getElementById('fbSection');

  if (!item.feedback?.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';

    const time = new Date(fb.ts).toLocaleString('ja-JP', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

// ============================================================
// Auto-save folder (File System Access API)
// ============================================================
let projectDirHandle = null;

async function pickProjectFolder() {
  if (!window.showDirectoryPicker) {
    toast('このブラウザはフォルダ選択に対応していません（Chrome/Edgeを使用してください）', 'err');
    return;
  }
  try {
    projectDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    const el = document.getElementById('folderStatus');
    el.textContent = projectDirHandle.name;
    el.classList.add('active');
    toast(`出力先: ${projectDirHandle.name}/`, 'ok');

    // フォルダ設定後にゲームデータ再取得（file://プロトコル時のCORS回避）
    if (!Object.keys(charDataCache || {}).length) {
      charDataCache = null;
      charSourceRaw = null;
      await fetchGameData();
      if (charDataCache && Object.keys(charDataCache).length) {
        const list = getCharList();
        let changed = false;
        for (const id of Object.keys(charDataCache)) {
          if (!list.includes(id)) { list.push(id); changed = true; }
        }
        if (changed) saveCharList(list);
        load();
        renderCharTabs();
        renderList();
        updateCounts();
        checkAllFiles();
        toast('ゲームデータを読み込みました', 'ok');
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') toast('フォルダ選択失敗', 'err');
  }
}

async function getSubDir(handle, path) {
  const parts = path.split('/').filter(Boolean);
  let dir = handle;
  for (const p of parts) {
    dir = await dir.getDirectoryHandle(p, { create: true });
  }
  return dir;
}

async function saveToFolder(blob, item) {
  // Determine target subdirectory based on item type
  const basePath = `public/characters/${currentCharId}`;
  const subPath = item.type === 'cg' ? `${basePath}/cg` : basePath;

  const dir = await getSubDir(projectDirHandle, subPath);
  const fileHandle = await dir.getFileHandle(item.file, { create: true });
  const writable = await fileHandle.createWritable();
  await writable.write(blob);
  await writable.close();
}

// ============================================================
// Review
// ============================================================
function convertToWebP(srcUrl, quality = 0.90) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      canvas.toBlob(blob => {
        if (!blob) { reject(new Error('WebP変換失敗')); return; }
        const url = URL.createObjectURL(blob);
        const origSize = Math.round(srcUrl.length * 3 / 4); // base64概算
        resolve({ url, blob, origSize, webpSize: blob.size });
      }, 'image/webp', quality);
    };
    img.onerror = () => reject(new Error('画像読み込み失敗'));
    img.src = srcUrl;
  });
}

async function adopt() {
  const item = items.find(i => i.id === selectedId);
  if (!item || !item.history.length) return;
  const img = document.querySelector('#imgPreview img');
  const srcUrl = img ? img.src : item.history[item.history.length - 1].url;
  for (const h of item.history) h.adopted = (h.url === srcUrl);
  item.adoptedImage = srcUrl;
  item.status = 'done';

  // WebP変換して保存
  const webpFile = item.id + '.webp';
  try {
    const result = await convertToWebP(srcUrl);
    item.file = webpFile;

    if (projectDirHandle) {
      // フォルダ設定済み → 自動保存
      await saveToFolder(result.blob, item);
      URL.revokeObjectURL(result.url);
      const pct = Math.round((1 - result.webpSize / result.origSize) * 100);
      const kb = (result.webpSize / 1024).toFixed(0);
      const subPath = item.type === 'cg' ? `cg/${webpFile}` : webpFile;
      toast(`「${item.trigger}」→ ${subPath} (${kb}KB, ${pct > 0 ? '-' + pct : '+' + Math.abs(pct)}%)`, 'ok');
    } else {
      // 未設定 → 従来のダウンロード
      const a = document.createElement('a');
      a.href = result.url; a.download = webpFile;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(result.url);
      const pct = Math.round((1 - result.webpSize / result.origSize) * 100);
      const kb = (result.webpSize / 1024).toFixed(0);
      toast(`「${item.trigger}」採用 → WebP ${kb}KB (${pct > 0 ? '-' + pct : '+' + Math.abs(pct)}%)`, 'ok');
    }
  } catch (err) {
    // フォールバック: 変換失敗時はそのままダウンロード
    const a = document.createElement('a');
    a.href = srcUrl; a.download = item.file;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast(`「${item.trigger}」採用（WebP変換失敗、元形式）`, 'info');
  }

  saveAll(); updateCounts(); selectItem(item.id);
  checkAllFiles();

  // Auto-advance to next pending
  const next = items.find(i => i.status === 'pending');
  if (next) setTimeout(() => selectItem(next.id), 300);
}

function doReject() {

function generateManifest() {
  const data = loadCharData(currentCharId) || {};
  const info = getCharInfo(currentCharId);
  const charName = data.charName || info?.name || '';
  const charNameEn = data.charNameEn || info?.nameEn || currentCharId.toUpperCase();
  const pad = (s, n) => s + ' '.repeat(Math.max(0, n - s.length));

  const cgs = items.filter(i => i.type === 'cg');
  const portraits = items.filter(i => i.type === 'portrait');
  const icons = items.filter(i => i.type === 'icon');
  const total = items.length;
  const doneCount = items.filter(i => i.status === 'done').length;
  const statusLine = doneCount === total ? '全て作成済み' :
    doneCount > 0 ? `${doneCount}/${total}枚 作成済み` : '全て未作成';

  let o = '';
  o += '# ============================================\n';
  o += '# Operation Nightcap - CG Manifest\n';
  o += `# Character: ${charNameEn} (${charName})\n`;
  o += '# ============================================\n';
  o += '#\n# フォーマット: ファイル名 | トリガー | 酔いLv | 備考\n';
  o += '# ============================================\n\n';

  o += `# --- イベントCG (${cgs.length}枚) ---\n`;
  o += `# 配置先: public/characters/${currentCharId}/cg/\n\n`;
  for (const r of cgs) o += `${pad(r.file, 26)}| ${pad(r.trigger, 18)}| ${pad(r.level || '', 6)}| ${r.note || ''}`.replace(/\s+$/, '') + '\n';

  o += `\n# --- 立ち絵 (${portraits.length}枚) ---\n`;
  o += `# 配置先: public/characters/${currentCharId}/\n\n`;
  for (const r of portraits) o += `${pad(r.file, 26)}| ${pad(r.trigger, 18)}| ${pad(r.level || '', 6)}| ${r.note || ''}`.replace(/\s+$/, '') + '\n';

  o += `\n# --- アイコン (${icons.length}枚) ---\n`;
  o += `# 配置先: public/characters/${currentCharId}/\n\n`;
  for (const r of icons) o += `${pad(r.file, 26)}| ${pad(r.trigger, 18)}| ${r.note || ''}`.replace(/\s+$/, '') + '\n';

  o += `\n# ============================================\n`;
  o += `# 合計: ${total}枚\n`;
  o += `# ステータス: ${statusLine}\n`;
  o += '# ============================================\n';
  return o;
}

function copyManifest() {

}

function downloadManifest() {
  const data = loadCharData(currentCharId) || {};
  const en = data.charNameEn || getCharInfo(currentCharId)?.nameEn || currentCharId;
  const blob = new Blob([generateManifest()], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${en.toLowerCase()}.txt`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('ダウンロード完了', 'ok');
}

function doImport() {
  const text = document.getElementById('importText').value;
  if (!text.trim()) { toast('空です', 'err'); return; }

  const lines = text.split('\n');
  let section = null;
  const newItems = [];

  for (const line of lines) {
    const t = line.trim();
    if (t.startsWith('#') || t === '') {
      if (t.includes('イベントCG')) section = 'cg';
      else if (t.includes('立ち絵') || t.includes('ポートレート')) section = 'portrait';
      else if (t.includes('アイコン')) section = 'icon';
      else if (t.includes('合計')) section = null;
      continue;
    }
    if (!section) continue;
    const parts = t.split('|').map(s => s.trim());
    if (parts.length < 2) continue;
    const file = parts[0], trigger = parts[1], level = parts[2] || '', note = parts[3] || '';
    const id = file.replace(/\.\w+$/, '');

    // Preserve existing progress
    const existing = items.find(i => i.id === id);
    if (existing) {
      existing.file = file; existing.trigger = trigger;
      existing.level = level; existing.note = note; existing.type = section;
      newItems.push(existing);
    } else {
      newItems.push(makeItem({ id, file, trigger, level, type: section, note }));
    }
  }

  if (newItems.length > 0) {
    items = newItems;
    saveAll(); renderList(); updateCounts();
    closeModal('importModal');
    toast(`インポート: ${newItems.length}件`, 'ok');
    checkAllFiles();
  } else {
    toast('パースできませんでした', 'err');
  }
}

// ドラッグオーバーレイ
(function setupDragDrop() {
  let dragCounter = 0;
  const overlay = () => document.getElementById('dropOverlay');

  document.addEventListener('dragenter', e => {
    if (!e.dataTransfer.types.includes('Files')) return;
    e.preventDefault();
    dragCounter++;
    overlay().classList.add('active');
  });
  document.addEventListener('dragleave', e => {
    dragCounter--;
    if (dragCounter <= 0) { dragCounter = 0; overlay().classList.remove('active'); }
  });
  document.addEventListener('dragover', e => {
    if (!e.dataTransfer.types.includes('Files')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  });
  document.addEventListener('drop', e => {
    e.preventDefault();
    dragCounter = 0;
    overlay().classList.remove('active');
    const file = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
    if (!file) { toast('画像ファイルのみ対応', 'err'); return; }
    handleDroppedImage(file);
  });
})();

document.addEventListener('paste', e => {
  // テキスト入力中は無視
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const file = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/'));
  if (!file) return;
  e.preventDefault();
  handleDroppedImage(file);
});

let charSourceRaw = null;
let gpState = null; // { dialogue, frames, cgColor, currentLine, currentFrame, typeTimer, displayText }

async function fetchCharSourceRaw() {
  if (charSourceRaw) return charSourceRaw;
  // 1. fetch（file://プロトコル時はスキップ）
  if (location.protocol !== 'file:') {
    try {
      const res = await fetch('../src/data/characters.ts?t=' + Date.now());
      if (res.ok) charSourceRaw = await res.text();
    } catch {}
  }
  // 2. File System Access API
  if (!charSourceRaw && projectDirHandle) {
    charSourceRaw = await readFileViaHandle('src/data/characters.ts');
  }
  // 3. インラインフォールバック
  if (!charSourceRaw && typeof EMBEDDED_CHARACTERS_SRC !== 'undefined') {
    charSourceRaw = EMBEDDED_CHARACTERS_SRC;
  }
  return charSourceRaw;
}

function extractCGEventData(charId, triggerCard) {
  if (!charSourceRaw) return null;

  // Find the character block
  const charRe = new RegExp(`\\b${charId}:\\s*\\{`, 'g');
  const charMatch = charRe.exec(charSourceRaw);
  if (!charMatch) return null;

  // Find cgEvents section within this character
  const afterChar = charSourceRaw.slice(charMatch.index);
  const cgEventsStart = afterChar.indexOf('cgEvents:');
  if (cgEventsStart < 0) return null;

  // Find the specific CG event by triggerCard
  const triggerRe = new RegExp(`\\{[\\s\\S]*?triggerCard:\\s*'${triggerCard}'[\\s\\S]*?\\}\\s*,?\\s*(?:\\{|\\])`, 'g');
  const afterCgEvents = afterChar.slice(cgEventsStart);
  const triggerMatch = triggerRe.exec(afterCgEvents);
  if (!triggerMatch) return null;

  // Extract the event block more carefully - find matching braces
  const eventStart = afterCgEvents.indexOf(triggerMatch[0]);
  let eventBlock = extractBalancedBlock(afterCgEvents, eventStart);
  if (!eventBlock) return null;

  // Parse dialogue
  const dialogue = [];
  const dlgRe = /\{\s*speaker:\s*'([^']*)'\s*,\s*text:\s*'([^']*)'\s*\}/g;
  let dm;
  while ((dm = dlgRe.exec(eventBlock)) !== null) {
    dialogue.push({ speaker: dm[1], text: dm[2] });
  }

  // Parse frames
  const frames = [];
  const framesMatch = eventBlock.match(/frames:\s*\[([\s\S]*?)\]/);
  if (framesMatch) {
    const frameRe = /\{([^}]*)\}/g;
    let fm;
    while ((fm = frameRe.exec(framesMatch[1])) !== null) {
      const block = fm[1];
      const label = block.match(/label:\s*'([^']*)'/) ?.[1] || '';
      const dialogueStart = block.match(/dialogueStart:\s*(\d+)/)?.[1];
      const transition = block.match(/transition:\s*'([^']*)'/) ?.[1] || 'fade';
      frames.push({
        label,
        dialogueStart: dialogueStart !== undefined ? parseInt(dialogueStart) : 0,
        transition,
      });
    }
  }

  // Parse cgColor
  const colorMatch = eventBlock.match(/cgColor:\s*'([^']*)'/);
  const cgColor = colorMatch ? colorMatch[1] : '#e85d3a';

  return { dialogue, frames, cgColor };
}

function extractBalancedBlock(src, startPos) {
  let depth = 0;
  let start = -1;
  for (let i = startPos; i < src.length; i++) {
    if (src[i] === '{') {
      if (depth === 0) start = i;
      depth++;
    } else if (src[i] === '}') {
      depth--;
      if (depth === 0) return src.slice(start, i + 1);
    }
  }
  return null;
}

async function openGamePreview() {
  const item = items.find(i => i.id === selectedId);
  if (!item || item.type !== 'cg') return;

  // ローカルに保存されたデータを優先、なければ characters.ts からパース
  let eventData = null;
  if (item.dialogue?.length) {
    eventData = { dialogue: item.dialogue, frames: item.frames || [], cgColor: item.cgColor || '#e85d3a' };
  } else {
    await fetchCharSourceRaw();
    eventData = extractCGEventData(currentCharId, item.id);
  }

  if (!eventData || eventData.dialogue.length === 0) {
    toast('このCGのセリフデータが見つかりません', 'err');
    return;
  }

  // Get image source
  const imgSrc = getThumbSrc(item);

  gpState = {
    dialogue: eventData.dialogue,
    frames: eventData.frames,
    cgColor: eventData.cgColor,
    imgSrc,
    currentLine: 0,
    currentFrame: 0,
    displayText: '',
    isTyping: false,
    typeTimer: null,
  };

  renderGamePreview();
  document.getElementById('gamePreviewOverlay').style.display = 'block';
  startTyping();
}

function renderGamePreview() {
  if (!gpState) return;
  const { dialogue, frames, cgColor, imgSrc, currentLine, currentFrame, displayText } = gpState;
  const line = dialogue[currentLine];
  if (!line) return;

  const hasFrames = frames && frames.length > 0;

  // Build image area
  let imageHtml = '';
  if (hasFrames) {
    const frame = frames[currentFrame];
    const frameLabel = frame?.label || '';
    // Use frame-specific image if available, fallback to item image
    const frameImgSrc = frame?.imageUrl || imgSrc;
    // Build frame dot indicators
    let dotsHtml = '';
    if (frames.length > 1) {
      dotsHtml = '<div class="gp-frame-dots">';
      for (let i = 0; i < frames.length; i++) {
        const cls = i === currentFrame ? 'active' : i < currentFrame ? 'passed' : '';
        dotsHtml += `<div class="gp-dot ${cls}"></div>`;
      }
      dotsHtml += '</div>';
    }

    if (frameImgSrc) {
      imageHtml = `
        <div class="gp-image">
          <div class="gp-seq-frame gp-seq-enter-fade" style="background:url('${frameImgSrc}') center/cover no-repeat; width:100%; height:100%;">
          </div>
          ${dotsHtml}
        </div>`;
    } else {
      imageHtml = `
        <div class="gp-image">
          <div class="gp-seq-frame gp-seq-enter-fade" style="background:linear-gradient(135deg, ${cgColor}44, ${cgColor}88); width:100%; height:100%;">
            <div class="gp-placeholder">
              <div style="font-size:80px">🎨</div>
              <div style="font-size:16px;color:#f5e6d3">${esc(frameLabel)}</div>
            </div>
          </div>
          ${dotsHtml}
        </div>`;
    }
  } else {
    if (imgSrc) {
      imageHtml = `<div class="gp-image"><img src="${imgSrc}" alt="CG"></div>`;
    } else {
      imageHtml = `
        <div class="gp-image" style="background:linear-gradient(135deg, ${cgColor}44, ${cgColor}88)">
          <div class="gp-placeholder">
            <div style="font-size:80px">🎨</div>
            <div style="font-size:16px;color:#f5e6d3">${esc(item?.trigger || '')}</div>
          </div>
        </div>`;
    }
  }

  const overlay = document.getElementById('gamePreviewOverlay');
  overlay.innerHTML = `
    <div class="game-preview-overlay" onclick="handlePreviewClick(event)">
      <button class="gp-close" onclick="event.stopPropagation();closeGamePreview()">✕</button>
      <div class="gp-progress">${currentLine + 1} / ${dialogue.length}</div>
      ${imageHtml}
      <div class="gp-textbox">
        <div class="gp-speaker">${esc(line.speaker)}</div>
        <div class="gp-text" id="gpText">${esc(displayText)}</div>
        <div class="gp-next">▶ クリックで次へ</div>
      </div>
    </div>
  `;
}

function startTyping() {
  if (!gpState) return;
  const line = gpState.dialogue[gpState.currentLine];
  if (!line) return;

  gpState.displayText = '';
  gpState.isTyping = true;
  let i = 0;
  const chars = line.text.split('');

  gpState.typeTimer = setInterval(() => {
    if (i < chars.length) {
      gpState.displayText += chars[i];
      i++;
      const el = document.getElementById('gpText');
      if (el) el.textContent = gpState.displayText;
    } else {
      clearInterval(gpState.typeTimer);
      gpState.typeTimer = null;
      gpState.isTyping = false;
    }
  }, 30);
}

function handlePreviewClick(e) {
  if (e.target.closest('.gp-close')) return;
  if (!gpState) return;

  if (gpState.isTyping) {
    // Show full text immediately
    clearInterval(gpState.typeTimer);
    gpState.typeTimer = null;
    gpState.isTyping = false;
    const line = gpState.dialogue[gpState.currentLine];
    gpState.displayText = line.text;
    const el = document.getElementById('gpText');
    if (el) el.textContent = gpState.displayText;
  } else {
    // Advance to next line
    gpState.currentLine++;
    if (gpState.currentLine >= gpState.dialogue.length) {
      closeGamePreview();
      return;
    }

    // Update frame if needed
    if (gpState.frames && gpState.frames.length > 0) {
      const newFrame = findLastIndex(gpState.frames, f =>
        f.dialogueStart !== undefined && f.dialogueStart <= gpState.currentLine
      );
      if (newFrame >= 0 && newFrame !== gpState.currentFrame) {
        gpState.currentFrame = newFrame;
      }
    }

    renderGamePreview();
    startTyping();
  }
}

function findLastIndex(arr, pred) {
  for (let i = arr.length - 1; i >= 0; i--) {
    if (pred(arr[i])) return i;
  }
  return -1;
}

function closeGamePreview() {
  if (gpState?.typeTimer) clearInterval(gpState.typeTimer);
  gpState = null;
  const overlay = document.getElementById('gamePreviewOverlay');
  overlay.style.display = 'none';
  overlay.innerHTML = '';
}

// ESCキーでプレビューを閉じる

});

// ============================================================
// Character Comparison View
// ============================================================
function showCompareView() {
  const charList = getCharList();
  if (charList.length < 1) { toast('キャラが1人以上必要です', 'err'); return; }

  // Collect all unique CG trigger cards across all characters
  const allTriggers = new Set();
  const charItems = {}; // charId -> { triggerCard -> status }

  for (const charId of charList) {
    const data = loadCharData(charId);
    const itemMap = {};
    if (data?.items) {
      for (const it of data.items) {
        if (it.type === 'cg') {
          allTriggers.add(it.id);
          itemMap[it.id] = it.status;
        }
      }
    }
    charItems[charId] = itemMap;
  }

  // Also add triggers from game data
  if (charDataCache) {
    for (const charId of charList) {
      const info = charDataCache[charId];
      if (info?.cgEvents) {
        for (const ev of info.cgEvents) {
          allTriggers.add(ev.triggerCard);
        }
      }
    }
  }
  // Add reverse harassment cards
  for (const rc of reverseHarassCards) {
    allTriggers.add(rc.id);
  }

  const triggerList = [...allTriggers].sort();

  // Build summary bars
  let summaryHtml = '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px">';
  for (const charId of charList) {
    const info = getCharInfo(charId);
    const data = loadCharData(charId);
    const label = data?.charName || info?.name || charId;
    const total = triggerList.length;
    const done = triggerList.filter(t => charItems[charId]?.[t] === 'done').length;
    const pct = total > 0 ? Math.round(done / total * 100) : 0;

    summaryHtml += `
      <div class="compare-summary" style="flex:1;min-width:150px;flex-direction:column">
        <div style="display:flex;justify-content:space-between">
          <span class="cs-char">${esc(label)}</span>
          <span style="color:var(--text-dim)">${done}/${total} (${pct}%)</span>
        </div>
        <div class="cs-bar"><div class="cs-fill" style="width:${pct}%"></div></div>
      </div>`;
  }
  summaryHtml += '</div>';

  // Build table
  let tableHtml = '<table class="compare-table"><thead><tr><th class="cg-name">CGイベント</th>';
  for (const charId of charList) {
    const info = getCharInfo(charId);
    const data = loadCharData(charId);
    const label = data?.charName || info?.name || charId;
    tableHtml += `<th>${esc(label)}</th>`;
  }
  tableHtml += '</tr></thead><tbody>';

  for (const trigger of triggerList) {
    const triggerName = cardNameCache[trigger] || trigger;
    const isReverse = reverseHarassCards.some(rc => rc.id === trigger);
    const reverseTag = isReverse ? ' <span style="color:#c77dff;font-size:0.8em">逆</span>' : '';

    tableHtml += `<tr><td class="cg-name">${esc(triggerName)}${reverseTag}</td>`;
    for (const charId of charList) {
      const status = charItems[charId]?.[trigger];
      let cls, title;
      if (status === 'done') { cls = 'done'; title = '採用済'; }
      else if (status === 'review') { cls = 'review'; title = 'レビュー中'; }
      else if (status === 'pending') { cls = 'pending'; title = '未作成'; }
      else { cls = 'none'; title = '未定義'; }
      tableHtml += `<td><span class="compare-cell ${cls}" title="${title}"></span></td>`;
    }
    tableHtml += '</tr>';
  }
  tableHtml += '</tbody></table>';

  // Legend
  const legendHtml = `
    <div class="compare-legend">
      <span><span class="compare-cell done"></span> 採用済</span>
      <span><span class="compare-cell review"></span> レビュー中</span>
      <span><span class="compare-cell pending"></span> 未作成</span>
      <span><span class="compare-cell none"></span> 未定義</span>
    </div>`;

  const overlay = document.getElementById('compareOverlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div class="compare-overlay" onclick="if(event.target===this)closeCompareView()">
      <div class="compare-panel">
        <div class="compare-header">
          <h3>キャラ間 CG比較</h3>
          ${legendHtml}
          <button class="compare-close" onclick="closeCompareView()">✕</button>
        </div>
        <div class="compare-body">
          ${summaryHtml}
          ${tableHtml}
        </div>
      </div>
    </div>
  `;
}

function closeCompareView() {
  const overlay = document.getElementById('compareOverlay');
  overlay.style.display = 'none';
  overlay.innerHTML = '';
}

function renderFrames(item) {

      ? `<img src="${f.imageUrl}" alt="F${i + 1}">`
      : '🖼';

    card.innerHTML = `
      <span class="frame-num">#${i + 1}</span>
      <div class="frame-thumb" onclick="pickFrameImage(${i})" title="クリックで画像設定">${thumbContent}</div>
      <div class="frame-fields">
        <div>
          <label>ラベル</label>
          <input value="${esc(f.label || '')}" onchange="updateFrame(${i},'label',this.value)" placeholder="シーン説明">
        </div>
        <div>
          <label>開始行</label>
          <input type="number" min="0" value="${f.dialogueStart || 0}" onchange="updateFrame(${i},'dialogueStart',parseInt(this.value)||0)">
        </div>
        <div>
          <label>トランジション</label>
          <select onchange="updateFrame(${i},'transition',this.value)">
            <option value="fade"${f.transition === 'fade' ? ' selected' : ''}>fade</option>
            <option value="slide-left"${f.transition === 'slide-left' ? ' selected' : ''}>slide-left</option>
            <option value="zoom"${f.transition === 'zoom' ? ' selected' : ''}>zoom</option>
            <option value="none"${f.transition === 'none' ? ' selected' : ''}>none</option>
          </select>
        </div>
      </div>
      <div class="frame-order-btns">
        <button onclick="moveFrame(${i},-1)" ${i === 0 ? 'disabled' : ''}>▲</button>
        <button onclick="moveFrame(${i},1)" ${i === item.frames.length - 1 ? 'disabled' : ''}>▼</button>
      </div>
      <button class="sm danger frame-del" onclick="event.stopPropagation();removeFrame(${i})">✕</button>
    `;

  }
}

function addFrame() {
  const item = items.find(i => i.id === selectedId);
  if (!item) return;
  if (!item.frames) item.frames = [];
  item.frames.push({ label: '', dialogueStart: item.dialogue?.length ? item.frames.length : 0, transition: 'fade', imageUrl: null });
  saveAll();
  renderFrames(item);
}

function removeFrame(idx) {
  const item = items.find(i => i.id === selectedId);
  if (!item?.frames) return;
  item.frames.splice(idx, 1);
  saveAll();
  renderFrames(item);
}

function moveFrame(idx, dir) {
  const item = items.find(i => i.id === selectedId);
  if (!item?.frames) return;
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= item.frames.length) return;
  [item.frames[idx], item.frames[newIdx]] = [item.frames[newIdx], item.frames[idx]];
  saveAll();
  renderFrames(item);
}

function updateFrame(idx, key, val) {
  const item = items.find(i => i.id === selectedId);
  if (!item?.frames?.[idx]) return;
  item.frames[idx][key] = val;
  saveAll();
}

function pickFrameImage(idx) {
  // Create file input to pick image for this frame
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const item = items.find(i => i.id === selectedId);
      if (!item?.frames?.[idx]) return;
      item.frames[idx].imageUrl = ev.target.result;
      saveAll();
      renderFrames(item);
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

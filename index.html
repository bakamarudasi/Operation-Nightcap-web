<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ロドスバー ～今夜は帰さない～</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/battle.css">
  <link rel="stylesheet" href="css/shop.css">
  <link rel="stylesheet" href="css/cg.css">
  <link rel="stylesheet" href="css/gallery.css">
</head>
<body>
  <!-- ============================================ -->
  <!-- メイン画面（居酒屋の入口） -->
  <!-- ============================================ -->
  <div id="screen-title" class="screen active">
    <div class="title-bg">
      <div class="title-overlay"></div>
      <!-- 提灯デコレーション -->
      <div class="lantern-row">
        <div class="lantern">酒</div>
        <div class="lantern">呑</div>
        <div class="lantern">処</div>
      </div>
      <div class="title-content">
        <div class="noren">
          <div class="noren-panel">ロ</div>
          <div class="noren-panel">ド</div>
          <div class="noren-panel">ス</div>
        </div>
        <h1 class="title-logo">ロドスバー</h1>
        <p class="title-sub">～今夜は帰さない～</p>
        <div class="title-menu">
          <button class="menu-btn" data-screen="select"><span class="menu-icon">🍶</span> 対戦する</button>
          <button class="menu-btn" data-screen="shop"><span class="menu-icon">🏮</span> ショップ</button>
          <button class="menu-btn" data-screen="gallery"><span class="menu-icon">🖼️</span> ギャラリー</button>
          <button class="menu-btn" data-screen="settings"><span class="menu-icon">⚙️</span> 設定</button>
        </div>
        <div class="title-money">💰 <span id="title-money">3200</span> 龍門幣</div>
      </div>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- 対戦相手選択画面 -->
  <!-- ============================================ -->
  <div id="screen-select" class="screen">
    <div class="select-header">
      <button class="back-btn" data-screen="title">← 戻る</button>
      <h2>対戦相手を選べ</h2>
    </div>
    <div class="select-body">
      <!-- 左: キャラカード一覧 -->
      <div id="character-list" class="character-list"></div>
      <!-- 右: ホバーで表示される説明パネル -->
      <div id="character-detail" class="character-detail">
        <div class="detail-inner">
          <div class="detail-portrait">
            <div id="detail-sprite" class="detail-sprite"></div>
          </div>
          <div class="detail-info">
            <h3 id="detail-name" class="detail-name"></h3>
            <p id="detail-subtitle" class="detail-subtitle"></p>
            <div class="detail-divider"></div>
            <div class="detail-stats">
              <div class="detail-stat-row">
                <span class="detail-stat-label">タイプ</span>
                <span id="detail-type" class="detail-stat-value"></span>
              </div>
              <div class="detail-stat-row">
                <span class="detail-stat-label">戦績</span>
                <span id="detail-record" class="detail-stat-value"></span>
              </div>
              <div class="detail-stat-row">
                <span class="detail-stat-label">CG解放</span>
                <span id="detail-cg" class="detail-stat-value"></span>
              </div>
            </div>
            <div class="detail-divider"></div>
            <p id="detail-quote" class="detail-quote"></p>
          </div>
          <button id="detail-battle-btn" class="menu-btn detail-battle-btn">この相手と飲む</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- 対戦画面 -->
  <!-- ============================================ -->
  <div id="screen-battle" class="screen">
    <div class="battle-header">
      <span class="battle-bar-name">ロドスバー</span>
      <span id="round-display" class="round-display">R.1/12</span>
      <span class="battle-money">💰 <span id="battle-money">3200</span></span>
    </div>
    <div class="battle-main">
      <div class="battle-left">
        <div class="opponent-area">
          <div id="opponent-sprite" class="character-sprite"></div>
          <div id="opponent-name" class="opponent-name"></div>
        </div>
      </div>
      <div class="battle-center">
        <div class="gauge-area">
          <div class="gauge-label">相手の酔い</div>
          <div class="drunk-gauge">
            <div id="opponent-gauge" class="drunk-gauge-fill" style="width:0%"></div>
          </div>
          <div id="opponent-drunk-text" class="gauge-text">Lv.0 シラフ (0/10)</div>
        </div>
        <div id="table-area" class="table-area">
          <div id="opponent-card-slot" class="card-slot opponent-slot">
            <div class="card card-back">?</div>
          </div>
          <div class="vs-text">VS</div>
          <div id="player-card-slot" class="card-slot player-slot">
            <div class="card card-back">?</div>
          </div>
        </div>
        <div id="dialogue-area" class="dialogue-area">
          <span id="dialogue-speaker" class="dialogue-speaker"></span>
          <span id="dialogue-text" class="dialogue-text"></span>
        </div>
        <div class="gauge-area player-gauge-area">
          <div class="gauge-label">ドクターの酔い</div>
          <div class="drunk-gauge">
            <div id="player-gauge" class="drunk-gauge-fill" style="width:0%"></div>
          </div>
          <div id="player-drunk-text" class="gauge-text">Lv.0 シラフ (0/10)</div>
        </div>
      </div>
      <div class="battle-right">
        <div id="deck-count" class="deck-count">残りデッキ: 12枚</div>
      </div>
    </div>
    <div id="hand-area" class="hand-area">
      <!-- 手札カードがここに入る -->
    </div>
    <div id="battle-result" class="battle-result hidden">
      <div class="result-content">
        <h2 id="result-title"></h2>
        <p id="result-message"></p>
        <div id="result-reward"></div>
        <button class="menu-btn" id="result-back-btn">店に戻る</button>
      </div>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- ショップ画面 -->
  <!-- ============================================ -->
  <div id="screen-shop" class="screen">
    <div class="shop-header">
      <button class="back-btn" data-screen="title">← 戻る</button>
      <h2>🏮 ロドスバー商店</h2>
      <span class="shop-money">💰 <span id="shop-money">3200</span> 龍門幣</span>
    </div>
    <div id="closure-dialogue" class="closure-dialogue"></div>
    <div id="shop-items" class="shop-items"></div>
    <div class="deck-editor">
      <h3>現在のデッキ (<span id="deck-size">12</span>/12)</h3>
      <div id="deck-display" class="deck-display"></div>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- ギャラリー画面（タブ切替: CG / 立ち絵） -->
  <!-- ============================================ -->
  <div id="screen-gallery" class="screen">
    <div class="gallery-header">
      <button class="back-btn" data-screen="title">← 戻る</button>
      <h2>🖼️ ギャラリー</h2>
    </div>
    <!-- タブ切替 -->
    <div class="gallery-tabs">
      <button class="gallery-tab active" data-tab="cg">🖼️ CG</button>
      <button class="gallery-tab" data-tab="portrait">👗 立ち絵</button>
    </div>
    <!-- CGタブ -->
    <div id="gallery-tab-cg" class="gallery-tab-content active">
      <span id="gallery-progress" class="gallery-progress">解放率: 0/0 (0%)</span>
      <div id="gallery-content" class="gallery-content"></div>
    </div>
    <!-- 立ち絵タブ -->
    <div id="gallery-tab-portrait" class="gallery-tab-content">
      <div class="portrait-view-layout">
        <!-- 左: キャラ選択リスト -->
        <div id="portrait-char-list" class="portrait-char-list">
          <!-- JSで動的に生成 -->
        </div>
        <!-- 右: 立ち絵表示エリア -->
        <div class="portrait-view-main">
          <div id="portrait-sprite-area" class="portrait-sprite-area">
            <div id="portrait-sprite" class="portrait-sprite"></div>
            <div id="portrait-blush" class="portrait-blush" style="opacity:0"></div>
          </div>
          <div class="portrait-info">
            <h3 id="portrait-char-name" class="portrait-char-name"></h3>
            <p id="portrait-char-subtitle" class="portrait-char-subtitle"></p>
          </div>
          <div id="portrait-drunk-selector" class="portrait-drunk-selector">
            <!-- 酔いLvボタンがJSで動的に生成 -->
          </div>
          <div id="portrait-dialogue" class="portrait-dialogue">
            <p id="portrait-line" class="portrait-line"></p>
            <button id="portrait-next-line" class="portrait-next-line-btn">↻ セリフ切替</button>
          </div>
          <div class="portrait-stats">
            <span id="portrait-record"></span>
            <span id="portrait-cg-progress"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- 設定画面 -->
  <!-- ============================================ -->
  <div id="screen-settings" class="screen">
    <div class="settings-header">
      <button class="back-btn" data-screen="title">← 戻る</button>
      <h2>⚙️ 設定</h2>
    </div>
    <div class="settings-content">
      <div class="settings-section">
        <label class="settings-label">🔊 BGM 音量</label>
        <input type="range" id="bgm-volume" min="0" max="100" value="80" class="settings-slider">
        <span id="bgm-volume-value" class="settings-value">80%</span>
      </div>
      <div class="settings-section">
        <label class="settings-label">🔉 SE 音量</label>
        <input type="range" id="se-volume" min="0" max="100" value="60" class="settings-slider">
        <span id="se-volume-value" class="settings-value">60%</span>
      </div>
      <div class="settings-section">
        <label class="settings-label">💬 テキスト速度</label>
        <input type="range" id="text-speed" min="10" max="80" step="5" value="30" class="settings-slider">
        <span id="text-speed-value" class="settings-value">ふつう</span>
      </div>
      <div class="settings-divider"></div>
      <div class="settings-section">
        <button class="menu-btn danger-btn" id="data-reset-btn">🗑️ データリセット</button>
      </div>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- CGオーバーレイ -->
  <!-- ============================================ -->
  <div id="cg-overlay" class="cg-overlay hidden">
    <div class="cg-image-container">
      <div id="cg-image" class="cg-image"></div>
    </div>
    <div id="cg-textbox" class="cg-textbox">
      <div id="cg-speaker" class="cg-speaker"></div>
      <div id="cg-text" class="cg-text"></div>
      <div class="cg-next">▶ クリックで次へ</div>
    </div>
  </div>

  <script src="js/data/cards.js"></script>
  <script src="js/data/characters.js"></script>
  <script src="js/data/shop.js"></script>
  <script src="js/game-state.js"></script>
  <script src="js/battle-engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cg-system.js"></script>
  <script src="js/shop-system.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

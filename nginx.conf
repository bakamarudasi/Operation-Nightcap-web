server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- セキュリティヘッダー ---
    # クリックジャッキング防止
    add_header X-Frame-Options "SAMEORIGIN" always;
    # XSSフィルター (レガシーブラウザ向け)
    add_header X-Content-Type-Options "nosniff" always;
    # MIME スニッフィング防止
    add_header X-XSS-Protection "1; mode=block" always;
    # リファラーポリシー
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # コンテンツセキュリティポリシー
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;
    # Permissions Policy (カメラ・マイク等を無効化)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- サーバー情報を隠す ---
    server_tokens off;

    # --- gzip圧縮 ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # --- 静的アセットキャッシュ ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- SPA フォールバック ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- 隠しファイルへのアクセス拒否 ---
    location ~ /\. {
        deny all;
        return 404;
    }
}

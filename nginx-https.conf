# =============================================================
# HTTPS対応 Nginx設定
#
# 使い方:
#   1. ドメインを取得してEC2のIPに向ける
#   2. まず HTTP (nginx.conf) で起動して certbot で証明書取得
#   3. この設定ファイルを nginx.conf にリネームして再ビルド
#
#   docker compose run --rm certbot certonly \
#     --webroot -w /var/lib/letsencrypt -d your-domain.com
#   cp nginx-https.conf nginx.conf
#   docker compose up -d --build
# =============================================================

# HTTP → HTTPS リダイレクト
server {
    listen 80;
    server_name _;

    # Let's Encrypt の認証用
    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS サーバー
server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- SSL/TLS 設定 ---
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # TLS 1.2+ のみ (1.0, 1.1は脆弱)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (ブラウザにHTTPS接続を強制)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # --- セキュリティヘッダー ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    server_tokens off;

    # --- gzip圧縮 ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # --- 静的アセットキャッシュ ---
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- SPA フォールバック ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- 隠しファイルへのアクセス拒否 ---
    location ~ /\. {
        deny all;
        return 404;
    }
}
